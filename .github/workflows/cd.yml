name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flask-demo:latest .

      - name: Test application files
        run: |
          echo "Docker image built successfully!"
          echo "Application deployment pipeline is working!"
